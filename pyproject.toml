[project]
name = "view-cuisines"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
